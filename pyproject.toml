[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "phasis"
version = "2.8.4"
description = "PHAS locus detection and scoring pipeline"
license = "Artistic-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "Thales H Cherubino Ribeiro, Atul Kakrana, Blake C. Meyers" }]
requires-python = ">=3.10,<3.13"

dependencies = [
  "numpy==1.26.4",
  "pandas",
  "scipy",
  "scikit-learn==1.3.2",
  "matplotlib",
  "seaborn",
  "tqdm",
]

[project.optional-dependencies]
bam = ["pysam>=0.23,<0.24"]

[project.scripts]
phasis = "phasis.cli:main"
phasis-compare = "phasis.result_comparison:main"

[tool.setuptools]
packages = ["phasis", "phasis.stages"]
