[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phasis"
version = "2.8.2"
description = "PHAS locus detection and scoring pipeline"
authors = [{ name = "Thales H Cherubino Ribeiro, Atul Kakrana, Blake C. Meyers" }]
requires-python = ">=3.10,<3.13"

dependencies = [
  "numpy==1.26.4",
  "pandas",
  "scipy",
  "scikit-learn==1.3.2",
  "matplotlib",
  "seaborn",
  "tqdm",
]

[project.scripts]
phasis = "phasis.cli:main"
phasis-compare = "phasis.result_comparison:main"

[tool.setuptools]
packages = ["phasis", "phasis.stages"]
